# The gate, run for everyone (spec D10-s, row 20e).
#
# Every row of this spec has been gated the same way by hand -- typecheck, lint, unit tests,
# build, browser tests -- and until now that discipline lived entirely in whoever was doing
# the work. A gate nobody can run but the author is a convention, not a guarantee: the first
# contributor, or the first tired afternoon, is the end of it.
#
# The steps are deliberately the same commands in the same order, rather than a tidier CI-only
# arrangement, so a failure here is reproducible locally by reading the log and typing what it
# says.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # The browser suite is the long pole; the whole gate takes a couple of minutes locally.
    timeout-minutes: 30
    steps:
      # Majors kept current deliberately (row 20j). The first remote run of this workflow
      # passed with a deprecation annotation: the v4 actions target Node 20, which the
      # runner no longer provides and was silently forcing onto Node 24. A warning that is
      # ignored is a warning nobody reads when it turns into a failure.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # `npm test` is Vitest in run mode. Unit stderr is expected to be empty -- a noisy
      # suite has hidden real failures in this repository before -- so it is captured and
      # checked rather than merged into the log.
      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2> >(tee /tmp/unit-stderr.txt >&2)
          if [ -s /tmp/unit-stderr.txt ]; then
            echo "::error::the unit suite wrote to stderr:"
            cat /tmp/unit-stderr.txt
            exit 1
          fi

      - name: Build
        run: npm run build

      # Chromium only, matching `playwright.config.ts`: every project there is Chromium with
      # a different viewport or device descriptor.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      # The harness builds and starts its own production server (e2e/server.ts), so this
      # does not reuse the build above -- deliberately, since that is what runs locally.
      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The four visual baselines (graphics spec P0-4, row 4).
  #
  # Pixels depend on the machine, so the baselines are taken on this runner and compared on
  # this runner, and nowhere else. A plain GitHub-hosted runner, not a container: this project
  # uses no Docker anywhere. The label is pinned to a release rather than `ubuntu-latest`, so
  # an Ubuntu version change is a commit here and not a surprise -- but GitHub still updates
  # the image within a release, which is why every baseline set records the environment it
  # was taken in and every comparison reports any difference from it.
  #
  # The commit message chooses the mode, because a manually-dispatched workflow must exist on
  # the default branch and this one does not:
  #   [visual update]   regenerate the baselines, upload them as `visual-baselines`, then
  #                     compare against them 25 times on the same runner -- the measurement
  #                     the diff budget is set from
  #   [visual measure]  compare 25 times against the committed baselines
  #   (otherwise)       compare twice -- two consecutive runs must both be zero diff
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate the baselines
        if: contains(github.event.head_commit.message, '[visual update]')
        run: npm run visual:update
      - name: Hand the baselines back for committing
        if: contains(github.event.head_commit.message, '[visual update]')
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: visual-tests/__screenshots__/
          retention-days: 7
          if-no-files-found: error

      - name: Compare with the baselines
        run: |
          node scripts/visual-environment.mjs check
          case "$MESSAGE" in *'[visual update]'*|*'[visual measure]'*) repeat=25 ;; *) repeat=2 ;; esac
          npm run test:visual -- --repeat-each="$repeat"
      - name: Keep the diffs from a failed comparison
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
